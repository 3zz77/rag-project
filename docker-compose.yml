version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rag123456}
      MYSQL_DATABASE: rag_qa_system
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/qa-system/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-vector:
    build: ./python-service
    container_name: rag-python
    environment:
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
    ports:
      - "5000:5000"
    volumes:
      - vector_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend/qa-system
    container_name: rag-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-rag123456}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      SPRING_PROFILES_ACTIVE: siliconflow-embedding
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      python-vector:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rag-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  vector_data:
